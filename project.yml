name: LinkMeter
options:
  bundleIdPrefix: com.robertvolk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  LinkMeter:
    build:
      targets:
        LinkMeter: all
    run:
      config: Release
    archive:
      config: Release

targets:
  LinkMeter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcons
    # Hand-maintained Info.plist, shipped verbatim (no XcodeGen `info:` directive).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertvolk.linkmeter
        PRODUCT_NAME: LinkMeter
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
