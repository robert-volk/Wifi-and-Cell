name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen (from official release, no Homebrew)
        run: |
          set -euo pipefail
          curl -fSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          XG_BIN="$(find xcodegen-dist -type f -name xcodegen -path '*/bin/*' | head -1)"
          "$XG_BIN" --version
          echo "XCODEGEN_BIN=$XG_BIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LinkMeter.xcodeproj \
            -scheme LinkMeter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Embed app icons into the built app
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LinkMeter.app"
          PLIST="$APP_PATH/Info.plist"
          cp Resources/AppIcons/*.png "$APP_PATH/"
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Delete :CFBundleIcons" "$PLIST" || true
          "$PB" -c "Add :CFBundleIcons dict" "$PLIST"
          "$PB" -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$PLIST"
          "$PB" -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
          i=0
          for n in AppIcon20x20 AppIcon29x29 AppIcon40x40 AppIcon60x60; do
            "$PB" -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:$i string $n" "$PLIST"
            i=$((i+1))
          done
          "$PB" -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$PLIST"

      - name: Ad-hoc sign with Wi-Fi entitlement (so AltServer sees it)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LinkMeter.app"
          codesign --force --sign - --entitlements Resources/LinkMeter.entitlements "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH" || true

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LinkMeter.app"
          if [ ! -d "$APP_PATH" ]; then echo "App not found at $APP_PATH"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LinkMeter-unsigned.ipa Payload
          ls -lh LinkMeter-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkMeter-unsigned-ipa
          path: LinkMeter-unsigned.ipa
          if-no-files-found: error
